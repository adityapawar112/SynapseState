apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "control-api.fullname" . }}-config
  labels:
    {{- include "control-api.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.env.NODE_ENV | quote }}
  PORT: {{ .Values.env.PORT | quote }}
  HOST: {{ .Values.env.HOST | quote }}
  AUTO_MIGRATE: {{ .Values.env.AUTO_MIGRATE | quote }}
  KEYSET_PATH: {{ .Values.env.KEYSET_PATH | quote }}
  LEASE_POOL_MAX: {{ .Values.env.LEASE_POOL_MAX | quote }}
  TELEMETRY_POOL_MAX: {{ .Values.env.TELEMETRY_POOL_MAX | quote }}
