apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "control-api.fullname" . }}
  labels:
    {{- include "control-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "control-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "control-api.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "control-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          env:
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: HOST
              value: {{ .Values.env.HOST | quote }}
            - name: AUTO_MIGRATE
              value: {{ .Values.env.AUTO_MIGRATE | quote }}
            - name: KEYSET_PATH
              value: {{ .Values.env.KEYSET_PATH | quote }}
            - name: LEASE_POOL_MAX
              value: {{ .Values.env.LEASE_POOL_MAX | quote }}
            - name: TELEMETRY_POOL_MAX
              value: {{ .Values.env.TELEMETRY_POOL_MAX | quote }}
            {{- if .Values.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.keys.databaseUrl }}
                  optional: true
            - name: LEASE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.keys.leaseDatabaseUrl }}
                  optional: true
            - name: TELEMETRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.keys.telemetryDatabaseUrl }}
                  optional: true
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.keyset.existingConfigMap }}
            - name: keyset-volume
              mountPath: {{ .Values.keyset.mountPath }}
              readOnly: true
            {{- end }}
            {{- if and .Values.emergencyLeases.enabled .Values.emergencyLeases.existingConfigMap }}
            - name: emergency-leases-volume
              mountPath: {{ .Values.emergencyLeases.mountPath }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.keyset.existingConfigMap }}
        - name: keyset-volume
          configMap:
            name: {{ .Values.keyset.existingConfigMap }}
            optional: true
        {{- end }}
        {{- if and .Values.emergencyLeases.enabled .Values.emergencyLeases.existingConfigMap }}
        - name: emergency-leases-volume
          configMap:
            name: {{ .Values.emergencyLeases.existingConfigMap }}
            optional: true
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
