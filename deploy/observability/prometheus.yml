global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts/*.yaml"

scrape_configs:
  - job_name: "synapsestate-control-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "control-api:3000"
          - "host.docker.internal:3000"
        labels:
          env: "prod"
          service: "control-api"
