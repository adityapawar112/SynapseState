<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: "Instrument Serif", Georgia, serif; font-size: 24px; fill: #121212; font-weight: 500; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #666666; }
      .step-num { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 12px; font-weight: 700; fill: #ffffff; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #121212; }
      .step-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #666666; line-height: 1.4; }
      .code-pill { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 10px; fill: #121212; }
      .badge-text { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 9px; font-weight: 600; fill: #ffffff; text-transform: uppercase; }
      .arrow-label { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 10px; fill: #666666; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#888888" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ff5e1f" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" fill="#ffffff" />

  <!-- Header -->
  <text x="40" y="44" class="title">Incident Lifecycle &amp; Git Dual Control (Invariant 4)</text>
  <text x="40" y="66" class="subtitle">From 2 AM Break-Glass Lease to Secondary Human Review via Automated Pull Request</text>

  <!-- ========================================================================= -->
  <!-- STEP 1: BREAK-GLASS OVERRIDE                                              -->
  <!-- ========================================================================= -->
  <rect x="40" y="95" width="205" height="235" rx="6" fill="#fff5f0" stroke="#ff5e1f" stroke-width="1.2" />
  <circle cx="65" cy="120" r="12" fill="#ff5e1f" />
  <text x="65" y="124" class="step-num" text-anchor="middle">1</text>
  <text x="88" y="125" class="step-title">Emergency Break-Glass</text>

  <rect x="55" y="145" width="80" height="15" rx="2" fill="#121212" />
  <text x="60" y="156" class="badge-text">2 AM INCIDENT</text>

  <text x="55" y="180" class="step-desc">Single operator signature.</text>
  <text x="55" y="196" class="step-desc">Time-limited TTL (30 min).</text>
  <text x="55" y="212" class="step-desc">Evaluates in-process in &#x2264;10s.</text>

  <!-- Code pill -->
  <rect x="52" y="240" width="180" height="42" rx="3" fill="#ffffff" stroke="#ffccbb" stroke-width="1" />
  <text x="60" y="256" class="code-pill" fill="#ff5e1f">synapse lease create</text>
  <text x="60" y="272" class="code-pill" fill="#666666">--flag checkout --ttl 30m</text>

  <text x="55" y="310" class="step-desc" fill="#059669">✓ Immediate Traffic Recovery</text>

  <!-- ========================================================================= -->
  <!-- STEP 2: AUDIT & IN-PROCESS INGESTION                                      -->
  <!-- ========================================================================= -->
  <rect x="280" y="95" width="205" height="235" rx="6" fill="#fcfcfc" stroke="#e4e4e7" stroke-width="1" />
  <circle cx="305" cy="120" r="12" fill="#121212" />
  <text x="305" y="124" class="step-num" text-anchor="middle">2</text>
  <text x="328" y="125" class="step-title">Sealed Audit Ledger</text>

  <rect x="295" y="145" width="75" height="15" rx="2" fill="#059669" />
  <text x="300" y="156" class="badge-text">TAMPER-EVIDENT</text>

  <text x="295" y="180" class="step-desc">State saved to audit_pending.</text>
  <text x="295" y="196" class="step-desc">SHA-256 chained sequence.</text>
  <text x="295" y="212" class="step-desc">SDKs long-poll via ETag.</text>

  <rect x="292" y="240" width="180" height="42" rx="3" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" />
  <text x="300" y="256" class="code-pill">prev_hash + sha256</text>
  <text x="300" y="272" class="code-pill" fill="#2563eb">p95 delivery &#x2264; 10s</text>

  <text x="295" y="310" class="step-desc" fill="#555555">✓ Zero Application Disruption</text>

  <!-- ========================================================================= -->
  <!-- STEP 3: GIT PROMOTION                                                     -->
  <!-- ========================================================================= -->
  <rect x="520" y="95" width="205" height="235" rx="6" fill="#fcfcfc" stroke="#e4e4e7" stroke-width="1" />
  <circle cx="545" cy="120" r="12" fill="#2563eb" />
  <text x="545" y="124" class="step-num" text-anchor="middle">3</text>
  <text x="568" y="125" class="step-title">Automated Pull Request</text>

  <rect x="535" y="145" width="95" height="15" rx="2" fill="#2563eb" />
  <text x="540" y="156" class="badge-text">GIT RECONCILIATION</text>

  <text x="535" y="180" class="step-desc">Operator initiates promote.</text>
  <text x="535" y="196" class="step-desc">Generates YAML diff in Git.</text>
  <text x="535" y="212" class="step-desc">Opens Draft PR on GitHub.</text>

  <rect x="532" y="240" width="180" height="42" rx="3" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
  <text x="540" y="256" class="code-pill" fill="#2563eb">synapse promote</text>
  <text x="540" y="272" class="code-pill" fill="#666666">--env prod &lt;lease_id&gt;</text>

  <text x="535" y="310" class="step-desc" fill="#2563eb">✓ Declarative Diff Staged</text>

  <!-- ========================================================================= -->
  <!-- STEP 4: MANDATORY SECONDARY APPROVAL                                      -->
  <!-- ========================================================================= -->
  <rect x="760" y="95" width="160" height="235" rx="6" fill="#fcfcfc" stroke="#059669" stroke-width="1.2" />
  <circle cx="785" cy="120" r="12" fill="#059669" />
  <text x="785" y="124" class="step-num" text-anchor="middle">4</text>
  <text x="808" y="125" class="step-title">Dual Control</text>

  <rect x="775" y="145" width="85" height="15" rx="2" fill="#059669" />
  <text x="780" y="156" class="badge-text">PEER REVIEW</text>

  <text x="775" y="180" class="step-desc">Human review required.</text>
  <text x="775" y="196" class="step-desc">CI tests &amp; linters pass.</text>
  <text x="775" y="212" class="step-desc">Merge to main baseline.</text>
  <text x="775" y="228" class="step-desc">Lease auto-expires.</text>

  <rect x="772" y="250" width="138" height="32" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="780" y="270" class="code-pill" fill="#059669">0 Permanent Drift</text>

  <text x="775" y="310" class="step-desc" fill="#059669">✓ Verified &amp; Merged</text>

  <!-- Connecting Arrows -->
  <line x1="245" y1="212" x2="272" y2="212" stroke="#ff5e1f" stroke-width="1.5" marker-end="url(#arrow-accent)" />
  <line x1="485" y1="212" x2="512" y2="212" stroke="#888888" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="725" y1="212" x2="752" y2="212" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Footer Banner -->
  <rect x="40" y="350" width="880" height="30" rx="3" fill="#f4f4f5" />
  <text x="55" y="370" class="badge-text" fill="#121212">INVARIANT 4 CONTRACT:</text>
  <text x="195" y="370" class="mono-code" fill="#555555">Emergency leases are ephemeral. Permanent production changes strictly require peer-reviewed Git merge.</text>
</svg>
