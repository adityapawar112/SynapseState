name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Build, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synapsestate
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: synapsestate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synapsestate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapsestate
      LEASE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapsestate
      TELEMETRY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapsestate
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: synapsestate
      PGHOST: localhost
      PGPORT: 5432
      SYNAPSE_API_TOKEN: "synapse-e2e-master-token-value-2026"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm -r run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test & Coverage
        run: pnpm run test:coverage

      - name: Install Playwright Browsers
        run: pnpm --filter @synapsestate/dashboard exec playwright install chromium --with-deps

      - name: E2E Browser Tests
        env:
          SYNAPSE_DEV_AUTH: "true"
          SYNAPSE_MOCK_PROMOTE: "true"
        run: pnpm run test:e2e

  mutation-tests:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run Stryker Mutation Testing (Core Invariants)
        run: pnpm run test:mutation:fast

  chaos-drills:
    name: Chaos & Disaster Recovery Drills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run Chaos Failure Drills
        run: pnpm run test:drills

