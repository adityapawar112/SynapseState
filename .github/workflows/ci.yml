name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Build, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synapsestate
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: synapsestate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synapsestate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapsestate
      LEASE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapsestate
      TELEMETRY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapsestate
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: synapsestate
      PGHOST: localhost
      PGPORT: 5432
      SYNAPSE_API_TOKEN: "synapse-e2e-master-token-value-2026"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm -r run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test & Coverage
        run: pnpm run test:coverage

      - name: Install Playwright Browsers
        run: pnpm --filter @synapsestate/dashboard exec playwright install chromium --with-deps

      - name: E2E Browser Tests
        env:
          SYNAPSE_DEV_AUTH: "true"
          SYNAPSE_MOCK_PROMOTE: "true"
        run: pnpm run test:e2e

  mutation-tests:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run Stryker Mutation Testing (Core Invariants)
        run: pnpm run test:mutation:fast

  chaos-drills:
    name: Chaos & Disaster Recovery Drills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run Chaos Failure Drills
        run: pnpm run test:drills

  load-benchmarks:
    name: k6 Load & Saturation Regression Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start Mock Control API
        run: |
          pnpm exec tsx load/k6/mock-server.ts &
          sleep 3
          curl --fail http://127.0.0.1:3000/health

      - name: Run k6 Mixed-Stress Smoke Benchmark (Regression Enforcement)
        env:
          CONTROL_API_URL: "http://127.0.0.1:3000"
          SUMMARY_PATH: "load/summary.json"
        run: pnpm run test:load

      - name: Run k6 4-Phase Story Arc Benchmark
        env:
          CONTROL_API_URL: "http://127.0.0.1:3000"
          SUMMARY_PATH: "load/summary.json"
          DURATION: "30s"
          VUS: "20"
          TELEMETRY_VUS: "20"
          WAIT_TIME: "5s"
        run: pnpm run test:load:story-arc

      - name: Upload k6 Benchmark Summary Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-benchmark-summary
          path: load/summary.json
          retention-days: 30

